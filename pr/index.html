  }

}
function trendSVG(pts){
  const W=200,H=70,px=16,py=18;const vs=pts.map(p=>p.p);
  let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<4){const m=(hi+lo)/2;lo=m-2;hi=m+2;}
  const x=i=>pts.length===1?W/2:px+i*(W-2*px)/(pts.length-1),y=v=>H-py-(v-lo)/(hi-lo)*(H-2*py);
  const path=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.p).toFixed(1)).join(" ");
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("trend")}">
    <line class="base" x1="${px}" x2="${W-px}" y1="${H-4}" y2="${H-4}" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.p)}" r="4" fill="currentColor"/><text x="${x(i)}" y="${Math.max(11,y(p.p)-7)}" text-anchor="${pts.length>1?(i===0?"start":i===pts.length-1?"end":"middle"):"middle"}">${Math.round(p.p*10)/10}</text>`).join("")}
  </svg>`;
}

    ${(s.side_events||[]).length?`<div class="tiles">${s.side_events.map(x=>`<div class="tile"><div class="en">${esc(st.lang==="es"?x.name_es:x.name)} · ${esc(gname(x.gauge))}</div>

  const TT=PAGE==="team"?t("teamTitle"):PAGE==="pr"?t("prTitle"):t("title");
  document.title=TT+(PAGE==="pr"?" · NSSA":" · NSSA "+D.nssa);
  document.getElementById("title").innerHTML=PAGE==="pr"?`${TT}<small>${t("prSub")}</small>`:`${TT}<small>${esc(D.shooter_name||"")} · ${t("sub")} ${esc(D.nssa)}</small>`;
  const lb=document.getElementById("langBtn");lb.textContent=st.lang==="es"?"English":"Español";
  lb.onclick=()=>{st.lang=st.lang==="es"?"en":"es";setLang(st.lang);try{history.replaceState(null,"",location.pathname+"?lang="+st.lang);}catch(e){}render();};
  renderNav();
  document.getElementById("app").innerHTML=PAGE==="team"?renderTeam():PAGE==="pr"?renderPR():renderMe();
  if(PAGE==="team")bindTeam();if(PAGE==="pr")bindPR();
  renderFoot();
}
render();
</script>
</body>
</html>
