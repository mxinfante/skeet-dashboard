<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23e86a1c%22/%3E%3C/svg%3E">
<title>Resultados de Skeet · NSSA</title>
<style>
:root{
  --bg:#f3f5f8;--card:#ffffff;--card2:#f8fafc;--ink:#0f172a;--muted:#5b6475;--line:#e2e7ee;
  --accent:#0a66c2;--accent-ink:#ffffff;--accent-soft:#e7f0fb;--accent-line:#b9d3f1;
  --hero1:#0a66c2;--hero2:#0b3f7a;--hero-ink:#ffffff;--hero-muted:#d4e4f7;--hero-tile:rgba(255,255,255,.14);
  --gold-bg:#fff2c2;--gold-ink:#6d4c00;--gold-line:#e9c64f;
  --silver-bg:#e6eaf0;--silver-ink:#2f3947;--silver-line:#98a3b3;
  --bronze-bg:#f9e2cf;--bronze-ink:#73390e;--bronze-line:#d9a074;
  --ok-bg:#e3f6ea;--ok-ink:#155c32;--warn-bg:#fff1dc;--warn-ink:#7a4b00;
  --band:#e9eef5;--band-ink:#1f2a3c;--me:#fff8e1;--me-line:#e9c64f;
  --bar:#0a66c2;--bar-bg:#e2e7ee;--shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0f15;--card:#151b23;--card2:#1b222c;--ink:#e6edf3;--muted:#9ba6b4;--line:#2a323d;
  --accent:#5aa9ff;--accent-ink:#06121f;--accent-soft:#16263a;--accent-line:#25476d;
  --hero1:#123a63;--hero2:#0c2340;--hero-ink:#f1f6fc;--hero-muted:#a9c3e0;--hero-tile:rgba(255,255,255,.08);
  --gold-bg:#3b3006;--gold-ink:#ffd968;--gold-line:#8a6d12;
  --silver-bg:#30363f;--silver-ink:#e3e8ef;--silver-line:#7d8794;
  --bronze-bg:#3a2415;--bronze-ink:#f2b488;--bronze-line:#8a5530;
  --ok-bg:#12301f;--ok-ink:#8fe0ad;--warn-bg:#3a2a0c;--warn-ink:#ffcb7a;
  --band:#1e2733;--band-ink:#dbe5f1;--me:#2b2610;--me-line:#8a6d12;
  --bar:#5aa9ff;--bar-bg:#2a323d;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:12px 12px 40px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
header.top h1{font-size:18px;margin:0;flex:1 1 auto;min-width:0}
header.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.xnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.xnav a{display:inline-flex;align-items:center;gap:4px;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.xnav a.here{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin:0 0 12px;min-width:0}
.card h2{font-size:16px;margin:0 0 2px}
.card h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
/* hero */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);border:0}
.hero .lbl{font-size:12px;color:var(--hero-muted);text-transform:uppercase;letter-spacing:.04em}
.hero .big{font-size:56px;font-weight:800;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:20px;font-weight:600;color:var(--hero-muted)}
.hero .sub{font-size:14px;color:var(--hero-muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--hero-tile);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--hero-muted)}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.hero .big{font-size:68px}}
/* strip */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:760px){.strip{grid-template-columns:repeat(6,minmax(0,1fr))}}
.chip{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:8px;text-align:center;min-width:0}
.chip .k{font-size:13px;font-weight:700;color:var(--muted)}
.chip .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chip .p{font-size:11px;color:var(--muted)}
/* season */
.season{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.season{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.season{grid-template-columns:repeat(6,minmax(0,1fr))}}
.gs{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.gs .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.gs .gn{font-size:14px;font-weight:700}
.gs .row b{font-size:20px;font-variant-numeric:tabular-nums}
.barbg{height:6px;background:var(--bar-bg);border-radius:6px;overflow:hidden;margin:6px 0}
.barbg i{display:block;height:100%;background:var(--bar)}
svg.trend{width:100%;height:auto;display:block;color:var(--accent);margin-top:4px}
svg.trend text{fill:var(--muted);font-size:11px;font-weight:600}
svg.trend .base{stroke:var(--line)}
/* shoot card */
.sh-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.sh-head .t{min-width:0;flex:1 1 220px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.place{background:var(--accent-soft);color:var(--ink);border-color:var(--accent-line)}
.banner{border-radius:12px;padding:8px 10px;margin:10px 0 0;font-size:13px;font-weight:600}
.banner.so{background:var(--warn-bg);color:var(--warn-ink)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){.tiles{grid-template-columns:repeat(7,minmax(0,1fr))}}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:4px}
.tile .en{font-size:12px;font-weight:700;color:var(--muted)}
.tile .sc{font-size:28px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .sc small{font-size:13px;font-weight:600;color:var(--muted)}
.tile .pc{font-size:12px;color:var(--muted)}
.tile.total{background:var(--accent-soft);border-color:var(--accent-line)}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{display:inline-flex;flex-direction:column;align-items:flex-start;border-radius:8px;padding:3px 7px;font-size:12px;font-weight:800;background:var(--card);border:1px solid var(--line);color:var(--ink);line-height:1.15;max-width:100%}
.badge em{font-style:normal;font-weight:500;font-size:11px;color:var(--muted)}
.badge.m1{background:var(--gold-bg);color:var(--gold-ink);border-color:var(--gold-line)}
.badge.m2{background:var(--silver-bg);color:var(--silver-ink);border-color:var(--silver-line)}
.badge.m3{background:var(--bronze-bg);color:var(--bronze-ink);border-color:var(--bronze-line)}
.badge.m1 em,.badge.m2 em,.badge.m3 em{color:inherit;opacity:.85}
.badge b{font-weight:800}
.badge.m1{--medal:#d4a017}.badge.m2{--medal:#9aa5b4}.badge.m3{--medal:#c27a3e}
.badge.m1 b::before,.badge.m2 b::before,.badge.m3 b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--medal);margin-right:4px;vertical-align:1px;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.rank{font-size:11px;color:var(--muted)}
/* team */
.controls{display:flex;flex-direction:column;gap:8px}
.controls input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit}
.band{background:var(--band);color:var(--band-ink);border-radius:12px;padding:8px 12px;font-weight:800;margin:16px 0 8px;display:flex;justify-content:space-between;gap:8px}
.band span{font-weight:600;font-size:12px;opacity:.8}
.people{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.people{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1050px){.people{grid-template-columns:repeat(3,minmax(0,1fr))}}
.person{margin:0}
.person.me{background:var(--me);border-color:var(--me-line)}
.person .nm{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.person .ct{font-size:12px;color:var(--muted)}
.person .tiles{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px}
.person .tile{padding:7px}
.person .tile .sc{font-size:20px}
.totalbar{margin-top:8px;border-radius:10px;padding:8px 10px;background:var(--accent);color:var(--accent-ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}
.totalbar b{font-size:20px;font-variant-numeric:tabular-nums}
.youtag{font-size:11px;font-weight:800;background:var(--gold-bg);color:var(--gold-ink);border:1px solid var(--gold-line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
/* desktop table */
.tablewrap{display:none}
.hint{display:none;font-size:12px;color:var(--muted);margin:4px 0}
.hint.on{display:block}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px;background:var(--card);table-layout:fixed}
col.c-name{width:190px}col.c-city{width:150px}col.c-ev{width:78px}col.c-aw{width:auto}
td.aw{white-space:normal}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{background:var(--card2);color:var(--muted);font-weight:700;position:sticky;top:0}
td.l,th.l{text-align:left;overflow:hidden;text-overflow:ellipsis}
td.aw{overflow:visible}
tr.me td{background:var(--me)}
td .badge{font-size:11px;padding:1px 5px;display:inline-block;margin:1px}
@media (min-width:1000px){.tablewrap{display:block}.people.cards-only{display:none}}
.more{display:block;margin:12px auto 0}
details.checked summary{cursor:pointer;font-weight:700}
details.checked li{font-size:12px;margin:2px 0}
footer{font-size:12px;color:var(--muted);margin-top:16px}
a{color:var(--accent)}
.empty{padding:20px;text-align:center;color:var(--muted)}
/* schedule / map / pr */
.finder{border:2px solid var(--accent-line)}
.finder .fl{display:block;font-size:17px;font-weight:800;margin-bottom:6px}
.finder input{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:16px}
.sres{display:flex;flex-direction:column;gap:4px;margin-top:8px}
a.srow2{display:block;text-decoration:none;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
a.srow2 small{display:block;color:var(--muted);font-size:12px}
.az{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.azb{padding:6px 10px;min-width:34px;text-align:center}
a.plink{color:inherit;text-decoration:underline;text-decoration-color:var(--accent-line);text-underline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;transition:all .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tabs a{flex:1 1 auto;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 10px;font-size:14px;font-weight:800;min-width:0}
.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs a.sec{flex:0 1 auto;font-weight:600;font-size:13px;border-style:dashed}
.tabs a.sec.on{border-style:solid}
:root{--heat-hi:#d9f2e3;--heat-lo:#f6b8b8;--heat-ink:#0f172a;--rep-bg:#f1ecff;--rep-ink:#4b2a9b;--rep-line:#c5b5f2}
@media (prefers-color-scheme:dark){:root{--heat-hi:#173a27;--heat-lo:#6b1f24;--heat-ink:#e6edf3;--rep-bg:#2a2140;--rep-ink:#d4c4ff;--rep-line:#5b4a8a}}
.sched{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.srow .d{font-weight:800;font-size:13px;line-height:1.15}
.srow .d small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.srow .e{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.kv{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.kv span{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 7px;white-space:nowrap}
.kv span b{font-variant-numeric:tabular-nums}
.kv span.f{background:var(--accent-soft);border-color:var(--accent-line)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
svg.fmap{width:100%;max-width:560px;height:auto;display:block;margin:6px auto 0}
svg.fmap .road{stroke:var(--line);stroke-width:4;stroke-linecap:round}
svg.fmap .rl{fill:var(--muted);font-size:9px;font-weight:600}
svg.fmap .fd{fill:var(--card2);stroke:var(--line);stroke-width:1.2}
svg.fmap .ft{fill:var(--muted);font-size:9px;font-weight:700}
svg.fmap .on .fd{fill:var(--accent);stroke:var(--accent)}
svg.fmap .on .ft{fill:var(--accent-ink);font-size:10px}
svg.fmap .tag{fill:var(--ink);font-size:8.5px;font-weight:800}
svg.fmap .so{fill:var(--band);stroke:var(--line)}
.hm{display:grid;grid-template-columns:44px repeat(4,minmax(0,1fr));gap:3px;font-size:12px}
.hm div{border-radius:6px;padding:6px 2px;text-align:center;font-variant-numeric:tabular-nums;min-width:0}
.hm .h{font-weight:700;color:var(--muted);background:none;font-size:11px}
.hm .c{color:var(--heat-ink);font-weight:700}
.hm .c small{display:block;font-weight:500;font-size:10px;opacity:.8}
.hm .x{background:var(--card2);color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:88px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:13px}
.brow .barbg{margin:0;height:10px}
.brow b{font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sw .tile .sc{font-size:22px}
.audit li{font-size:13px;margin:4px 0}
.flag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;background:var(--warn-bg);color:var(--warn-ink);margin-left:4px}
.lb{display:flex;flex-direction:column;gap:4px}
.lbr{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.lbr .n{font-weight:800;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.lbr .nm{min-width:0;overflow-wrap:anywhere;font-weight:700}
.lbr .nm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.lbr .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lbr .v small{font-weight:600;color:var(--muted)}
.lbr.me{background:var(--me);border-color:var(--me-line)}
.mt{display:grid;grid-template-columns:minmax(0,1fr) 30px 30px 30px 40px 34px;gap:5px 5px;align-items:center;font-size:13px}
.mt .rp{display:block;font-size:10px;font-weight:700;color:var(--rep-ink,var(--muted));line-height:1}
.mt .tt{background:var(--accent-soft);border-radius:6px;padding:2px 0}
.mt .gt{border-top:2px solid var(--line);padding-top:6px;margin-top:2px;font-weight:800}
.mt .nm.gt{font-size:12px}
.mt .hd{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
.mt .nm{min-width:0;overflow-wrap:anywhere;font-weight:700}
.mt .ct{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.dot.g{background:#d4a017}.dot.s{background:#9aa5b4}.dot.b{background:#c27a3e}
.cd{display:flex;flex-wrap:wrap;gap:6px}
.cd span{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:700}
.cd span small{font-weight:500;color:var(--muted)}
/* ===================== v2 visual layer ===================== */
:root{
  --bg:#eef2f7;--card:#ffffff;--card2:#f6f8fb;--ink:#0d1726;--muted:#566275;--line:#dfe5ee;
  --accent:#1257b8;--accent-ink:#ffffff;--accent-soft:#e8f0fc;--accent-line:#b8cff0;
  --hero1:#0b4aa2;--hero2:#08264f;--hero3:#0f6fc9;--hero-ink:#ffffff;--hero-muted:#cfe0f7;--hero-tile:rgba(255,255,255,.12);
  --g12:#2563eb;--g20:#d97706;--g28:#059669;--g410:#db2777;--gdbl:#7c3aed;--ghoa:#0e7490;--ghaa:#334155;
  --gold:#d9a516;--gold2:#f6d365;--silver:#97a3b4;--silver2:#e3e8ef;--bronze:#bd6f35;--bronze2:#efb27f;
  --shadow:0 1px 2px rgba(13,23,38,.05),0 6px 18px -6px rgba(13,23,38,.12);--shadow2:0 10px 30px -10px rgba(13,23,38,.35);
  --r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#080c12;--card:#111821;--card2:#17202b;--ink:#e8eef5;--muted:#9fabba;--line:#26313e;
  --accent:#6cb2ff;--accent-ink:#04111f;--accent-soft:#14263b;--accent-line:#2a4a70;
  --hero1:#0e3466;--hero2:#071a33;--hero3:#14508f;--hero-ink:#f3f7fc;--hero-muted:#b4c9e3;--hero-tile:rgba(255,255,255,.08);
  --g12:#6ea2ff;--g20:#f5b041;--g28:#34d399;--g410:#f472b6;--gdbl:#b394ff;--ghoa:#4fc3d9;--ghaa:#c3cedb;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px -10px rgba(0,0,0,.7);--shadow2:0 12px 30px -10px rgba(0,0,0,.8);
}}
html,body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header.top h1{font-size:20px;letter-spacing:-.01em}
.card{border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:18px;letter-spacing:-.01em;margin-bottom:4px}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.btn{min-height:40px;padding:8px 14px;font-size:14px}
.xnav a{min-height:40px;padding:8px 14px;font-size:14px}
.azb{min-width:40px;min-height:40px;padding:6px 10px}
.tabs a{min-height:44px;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .2s}
.tabs a.on{box-shadow:var(--shadow)}
.seg .btn{min-height:40px}
/* hero with skeet motif */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,var(--hero3) 0%,transparent 55%),linear-gradient(140deg,var(--hero1),var(--hero2));box-shadow:var(--shadow2);border-radius:22px}
.hero>*{position:relative;z-index:1}
.hero .art{position:absolute;z-index:0;right:-48px;top:-44px;width:230px;height:230px;opacity:.13;pointer-events:none;color:#fff}
.hero .big{font-size:58px;letter-spacing:-.03em}
.hero .stat{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.10)}
.hero .stat span small{display:block;opacity:.8;font-size:11px}
.hero .stat b{font-size:24px;letter-spacing:-.01em}
.herogrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.rings{display:flex;gap:8px}
.ring{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--hero-muted);font-weight:700}
svg.rg{display:block}
svg.rg .bgc{stroke:currentColor;opacity:.18}
svg.rg text{font-weight:800;font-variant-numeric:tabular-nums}
/* gauge accents */
.tile{border-radius:14px;padding:12px 11px 11px;background:linear-gradient(var(--gc,var(--line)),var(--gc,var(--line))) top/100% 3px no-repeat,var(--card2)}
.tile.total{background:linear-gradient(var(--gc,var(--accent)),var(--gc,var(--accent))) top/100% 3px no-repeat,var(--accent-soft)}
.tile .en{display:flex;align-items:center;gap:6px}
.tile .en::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gc,var(--muted));flex:none}
.chip{background:linear-gradient(var(--gc,var(--accent-line)),var(--gc,var(--accent-line))) top/100% 3px no-repeat,var(--accent-soft)}
/* notes / empty */
.note{border-left:3px solid var(--accent-line);padding:6px 10px;background:var(--card2);border-radius:0 10px 10px 0;line-height:1.45}
.empty{border:1px dashed var(--line);border-radius:14px;background:var(--card2)}
.na{display:flex;gap:8px;align-items:flex-start;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13px;background:var(--card2)}
/* medal visuals */
svg.md{display:inline-block;vertical-align:middle;flex:none}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin:12px 0 6px}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.pd .who{font-size:12px;font-weight:800;line-height:1.2;overflow-wrap:anywhere;min-height:30px;display:flex;align-items:flex-end}
.pd .blk{width:100%;border-radius:12px 12px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;color:#fff;font-weight:900;box-shadow:var(--shadow)}
.pd .blk b{font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.pd .blk small{font-size:11px;font-weight:700;opacity:.9}
.pd.p1 .blk{height:118px;background:linear-gradient(180deg,#f3cd4a,#d9a516);color:#3a2900}
.pd.p2 .blk{height:92px;background:linear-gradient(180deg,#dfe5ec,#aeb9c7);color:#1c2430}
.pd.p3 .blk{height:74px;background:linear-gradient(180deg,#b5662f,#8a4719);color:#fff}
.pd .rp2{font-size:11px;font-weight:800;color:var(--rep-ink)}
/* stacked medal bars */
.stk{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.stk .r{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:12px}
.stk .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.stk .bar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--bar-bg)}
.stk .bar i{display:block;height:100%}
.stk .bar i.g{background:var(--gold)}.stk .bar i.s{background:var(--silver)}.stk .bar i.b{background:var(--bronze)}.stk .bar i.o{background:color-mix(in srgb,var(--accent) 45%,var(--card))}
.stk .bar i.x{background:repeating-linear-gradient(45deg,var(--rep-line) 0 4px,var(--rep-bg) 4px 8px)}
.stk .r b{text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* donut */
.donutwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:8px}
svg.dn text{font-weight:800}
.dleg{display:flex;flex-direction:column;gap:5px;font-size:13px}
.dleg span{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.dleg i{width:12px;height:12px;border-radius:3px}
.dleg b{font-variant-numeric:tabular-nums}
/* horizontal bar leaderboard */
.lbr{position:relative;overflow:hidden;min-height:44px;border-radius:12px}
.lbr .hb{position:absolute;left:0;top:0;bottom:0;background:var(--gc,var(--accent));opacity:.13;border-radius:0 8px 8px 0;pointer-events:none}
.lbr>*{position:relative}
.lbr a.plink::after{content:"";position:absolute;inset:0}
.lbr .n{font-size:13px}
/* medal table v2 */
.mt{grid-template-columns:minmax(0,1fr) 30px 30px 30px 34px 46px;gap:2px 5px}
.mt .hd{padding:4px 0}
.mt .nm,.mt .ct{padding:7px 0;border-bottom:1px solid var(--line)}
.mt .nm{display:flex;align-items:center;gap:4px;min-height:40px;padding:0}
.mt .nm a.plink{display:flex;align-items:center;min-height:40px;flex:0 1 auto;min-width:0}
.mt .ct{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;min-height:40px;line-height:1.1}
.mt .ct.tt{min-height:34px;align-self:center}
.mt .hd svg.md{margin:0 auto}
.mt .tt{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:5px 0;border-bottom:0;font-size:15px}
.mt .tt .rp{color:inherit;opacity:.9}
.mt .hd.tt{background:none;color:var(--ink)}
.mt .gt{border-top:2px solid var(--ink);border-bottom:0;padding-top:8px}
.mt .tt.gt{border-top:0;margin-top:4px}
/* histogram */
svg.hist{width:100%;height:auto;display:block}
svg.hist .b0{fill:var(--bar-bg)}
svg.hist .b1{fill:var(--accent)}
svg.hist text{fill:var(--muted);font-size:10px;font-weight:600}
svg.hist .me{fill:var(--gold)}
/* compare chart (personal) */
.cmp{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.cmp .r{display:grid;grid-template-columns:4.6em minmax(0,1fr) 3.6em;gap:8px;align-items:center;font-size:12px}
.cmp .tr{position:relative;height:22px;background:var(--card2);border:1px solid var(--line);border-radius:8px}
.cmp .tr .me{position:absolute;left:0;top:3px;bottom:3px;border-radius:5px;background:var(--gc,var(--accent))}
.cmp .tr .mk{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px}
.cmp .mk.ca{background:var(--ink);opacity:.55}.cmp .mk.cm{background:var(--gold)}.cmp .mk.tp{background:var(--g410)}
.cmp b{text-align:right;font-variant-numeric:tabular-nums}
/* gauge rings grid (personal season) */
.season{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:760px){.season{grid-template-columns:repeat(6,minmax(0,1fr))}}
.gs{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.gs .gn{font-size:13px;font-weight:800}
/* heat legend */
.hlg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:8px}
.hlg i{flex:1;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--heat-lo),var(--heat-hi))}
.youtag{white-space:nowrap;flex:none}
/* motion */
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app>section,#app>details,#app>nav{animation:fu .32s ease both}
#app.noanim>*{animation:none!important}
@media (prefers-reduced-motion:reduce){#app>section,#app>details,#app>nav{animation:none}.tabs a{transition:none}}
@media (min-width:760px){.hero .art{width:340px;height:340px;right:-20px;top:-60px}}
@media (min-width:760px){.podium{max-width:560px;margin-left:auto;margin-right:auto}.mt{max-width:680px}.stk{max-width:720px}.donutwrap{max-width:520px}.cmp{max-width:760px}}
</style>

  return `<svg class="rg" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" role="img" aria-label="${esc(label)} ${fmtp(p)}"><circle class="bgc" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke-width="6"/><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(c*v/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${cx} ${cx})"/><text x="${cx}" y="${cx+sz*.075}" text-anchor="middle" font-size="${Math.round(sz*.21)}" fill="${txt||"currentColor"}">${p==null?"–":(Math.round(p*10)/10).toLocaleString(st.lang==="es"?"es-PR":"en-US")}</text></svg>`;}
function donut(parts,sz,label,center,sub){const tot=parts.reduce((a,p)=>a+p.v,0)||1,r=sz/2-12,c=2*Math.PI*r,cx=sz/2;let off=0;
  const segs=parts.filter(p=>p.v).map(p=>{const L=c*p.v/tot;const s=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${p.color}" stroke-width="20" stroke-dasharray="${Math.max(0,L-1.5).toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 ${cx} ${cx})"><title>${esc(p.label)}: ${p.v}</title></circle>`;off+=L;return s;}).join("");
  return `<svg class="dn" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" role="img" aria-label="${esc(label)}">${segs}<text x="${cx}" y="${cx+2}" text-anchor="middle" font-size="24" fill="var(--ink)">${center}</text><text x="${cx}" y="${cx+19}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)">${esc(sub||"")}</text></svg>`;}
const CLSC={AAA:"#0b3d91",AA:"#1d6fd8",A:"#38a3e8",B:"#20a98f",C:"#e9a823",D:"#e46f2e",E:"#cf3d57","–":"#98a3b3"};
function classDonut(classes){const ks=[...CLASSES,"–"].filter(c=>classes[c]);const n=ks.reduce((a,c)=>a+classes[c],0);
  return `<div class="donutwrap">${donut(ks.map(c=>({v:classes[c],color:CLSC[c],label:c==="–"?t("noHOA"):t("cls")+" "+c})),150,t("classDist"),n,t("shooters"))}
    <div class="dleg">${ks.map(c=>`<span><i style="background:${CLSC[c]}"></i>${c==="–"?t("noHOA"):t("cls")+" "+c}<b>${classes[c]} <small class="muted">${Math.round(100*classes[c]/n)}%</small></b></span>`).join("")}</div></div>`;}
const ctot=p=>p.gold+p.silver+p.bronze+(p.other||0);
function byCombined(people){return [...people].filter(p=>p.awards.length).sort((a,b)=>ctot(b)-ctot(a)||b.gold-a.gold||b.silver-a.silver||a.name.localeCompare(b.name));}
function podium(people){const P=byCombined(people).slice(0,3);if(!P.length)return "";const order=[P[1],P[0],P[2]],cls=["p2","p1","p3"],nn=[2,1,3];
  return `<div class="podium" role="img" aria-label="${esc(t("podium"))}: ${P.map(p=>esc(p.name)+" "+ctot(p)).join(", ")}">${order.map((p,i)=>p?`<div class="pd ${cls[i]}">${medalIcon(nn[i],nn[i]===1?30:24)}<div class="who">${plink(p.nssa,p.name)}</div><div class="blk"><b>${ctot(p)}</b><small>${t("awardsW")}</small></div></div>`:`<div></div>`).join("")}</div>`;}
function stacked(people,n){const P=byCombined(people).slice(0,n||10);if(!P.length)return "";const mx=Math.max(...P.map(ctot));
  const seg=(v,c)=>v?`<i class="${c}" style="width:${(100*v/mx).toFixed(1)}%"></i>`:"";
  return `<div class="stk" role="img" aria-label="${esc(t("stackT"))}">${P.map(p=>`<div class="r"><span class="nm">${esc(p.name)}</span><span class="bar">${seg(p.gold,"g")}${seg(p.silver,"s")}${seg(p.bronze,"b")}${seg(p.other||0,"o")}</span><b>${ctot(p)}</b></div>`).join("")}</div>
  <div class="legend"><span><i style="background:var(--gold)"></i>${t("gold")}</span><span><i style="background:var(--silver)"></i>${t("silver")}</span><span><i style="background:var(--bronze)"></i>${t("bronze")}</span><span><i style="background:color-mix(in srgb,var(--accent) 45%,var(--card))"></i>${t("other")}</span></div>`;}
function histogram(F,g,isTeam,meId){const full=F.meta[g]&&F.meta[g].full_shot;if(!full)return "";
  const rows=F.shooters.filter(p=>p.ev[g]&&p.ev[g].t===full);if(!rows.length)return "";
  const sc=rows.map(p=>p.ev[g].b),lo=Math.min(...sc),hi=Math.max(...sc),rng=hi-lo+1,bw=rng<=36?1:Math.ceil(rng/36),nb=Math.ceil(rng/bw);
  const all=Array(nb).fill(0),pr=Array(nb).fill(0);let meBin=-1;
  rows.forEach(p=>{const i=Math.floor((p.ev[g].b-lo)/bw);all[i]++;if(isTeam(p))pr[i]++;if(p.nssa===meId)meBin=i;});
  const mxPR=Math.max(1,...pr),rug=Math.min(5,mxPR)*6+4;const W=340,H=130+rug,pl=24,pb=18+rug,pt=12,cw=(W-pl-4)/nb,mx=Math.max(...all),y=v=>H-pb-(H-pb-pt)*v/mx;
  let b="";for(let i=0;i<nb;i++){const x=pl+i*cw;const lab=bw===1?lo+i:`${lo+i*bw}–${lo+i*bw+bw-1}`;
    b+=`<rect class="b0" x="${(x+.5).toFixed(1)}" y="${y(all[i]).toFixed(1)}" width="${Math.max(1,cw-1).toFixed(1)}" height="${(H-pb-y(all[i])).toFixed(1)}"><title>${lab}: ${all[i]}</title></rect>`;
    if(pr[i]){b+=`<rect class="b1" x="${(x+.5).toFixed(1)}" y="${y(pr[i]).toFixed(1)}" width="${Math.max(1,cw-1).toFixed(1)}" height="${(H-pb-y(pr[i])).toFixed(1)}"><title>PR ${lab}: ${pr[i]}</title></rect>`;
      for(let k=0;k<Math.min(5,pr[i]);k++)b+=`<circle class="b1" cx="${(x+cw/2).toFixed(1)}" cy="${(H-pb+6+k*6).toFixed(1)}" r="${Math.min(2.6,cw/2-.3).toFixed(1)}"/>`;}}
  if(meBin>=0){const x=pl+meBin*cw+cw/2;b+=`<path class="me" d="M${(x-5).toFixed(1)} ${pt-10} L${(x+5).toFixed(1)} ${pt-10} L${x.toFixed(1)} ${pt-2} Z"/>`;}
  const ticks=[lo,Math.round((lo+hi)/2),hi].map((v,i)=>`<text x="${(pl+((v-lo)/bw)*cw+cw/2).toFixed(1)}" y="${H-4}" text-anchor="${["start","middle","end"][i]}">${v}</text>`).join("");
  return `<svg class="hist" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("histT"))} · ${esc(gname(g))}: ${rows.length} ${esc(t("shooters"))}, ${pr.reduce((a,v)=>a+v,0)} PR"><text x="2" y="${pt+4}">${mx}</text><text x="2" y="${H-pb}">0</text><line x1="${pl}" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${b}${ticks}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>${t("histPR")} (${pr.reduce((a,v)=>a+v,0)})</span><span><i style="background:var(--bar-bg)"></i>${t("histRest")}</span>${meBin>=0?`<span><i style="background:var(--gold);clip-path:polygon(0 0,100% 0,50% 100%)"></i>${t("you")}</span>`:""}<span>${bw>1?t("binW").replace("N",bw):""}</span></div>`;}
function countUp(){if(RM()||st.cuDone)return;st.cuDone=true;
  document.querySelectorAll("[data-cu]").forEach(el=>{const to=+el.dataset.cu;if(!isFinite(to)||to<=0)return;const t0=performance.now(),d=700;
    const step=n=>{const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(step);else el.textContent=to;};requestAnimationFrame(step);});}

function rankLine(r){if(!r||!r.rank)return "";
  return `<div class="rank">${t("overall")}: ${r.rank} ${t("of")} ${r.of}${r.tie?` (${t("tieWith")} ${r.tie})`:""}</div>`;}

/* ---------------- team view ---------------- */
function teamData(){
  const S=(D.shoots||[]).filter(s=>s.field);return S;
}
function personClass(p){const e=p.ev.HOA||p.ev.HAA||Object.values(p.ev)[0];return (p.ev.HOA&&p.ev.HOA.c)||(e&&e.c)||"";}
function personConcs(p){const set=new Set();Object.values(p.ev).forEach(e=>(e.aw||[]).forEach(c=>{const a=award(c);if(a.conc)set.add(a.conc);}));return [...set].sort();}
function renderTeam(){
  const S=teamData();
  if(!S.length)return `<div class="card empty">${t("noField")}</div>`;
  if(st.ti>=S.length)st.ti=0;
  const s=S[st.ti],F=s.field,evs=F.events;
  const isTeam=p=>p.city&&new RegExp(",\\s*"+F.team_state+"$").test(p.city);
  let list=F.shooters.filter(p=>st.filter==="team"?isTeam(p):true);
  if(st.filter==="all"&&st.q){const q=st.q.toLowerCase();list=list.filter(p=>(p.name+" "+p.city+(PAGE==="event"?"":" "+p.nssa)).toLowerCase().includes(q));}
  const nTeam=F.shooters.filter(isTeam).length;
  let h=(PAGE==="team"?`<section class="card hero">${heroArt()}<div class="lbl">${esc(s.name)} · ${esc(fmtDate(s.start,s.end))}</div><div class="big"><span data-cu="${nTeam}">${nTeam}</span><small> ${t("shooters")} ${esc(F.team_state)}</small></div><div class="sub">${t("of2")} ${F.shooters.length} ${t("fieldOf")} · ${t("official")}</div></section>`:"")+`<section class="card"><div class="controls">
    ${S.length<2?(PAGE==="team"?"":`<div><b>${esc(s.name)}</b></div>`):`<div class="seg">${S.map((x,i)=>`<button class="btn" type="button" data-ti="${i}" aria-pressed="${i===st.ti}">${esc(x.name)}</button>`).join("")}</div>`}
    <div class="seg"><button class="btn" type="button" data-f="team" aria-pressed="${st.filter==="team"}">${t("teamPR").replace("PR",F.team_state)} (${nTeam})</button>
      <button class="btn" type="button" data-f="all" aria-pressed="${st.filter==="all"}">${t("all")} (${F.shooters.length})</button></div>
    <div class="seg"><button class="btn" type="button" data-g="class" aria-pressed="${st.group==="class"}">${t("byClass")}</button>
      <button class="btn" type="button" data-g="conc" aria-pressed="${st.group==="conc"}">${t("byConc")}</button></div>
    ${st.filter==="all"?`<input id="q" type="search" placeholder="${t("search")}" value="${esc(st.q)}">`:""}
    <div class="muted small">${esc(fmtDate(s.start,s.end))} · ${t("official")} · ${st.group==="class"?t("classNote"):t("concNote")} ${st.filter==="team"?t("teamNote").replace("PR",F.team_state):""}</div>
  </div></section>`;
  { const HE=evs.filter(g=>F.meta[g]&&F.meta[g].full_shot);if(!HE.includes(st.hev))st.hev=HE.includes("HOA")?"HOA":HE[0];
    if(st.hev)h+=`<section class="card" id="histo"><h2>${t("histT")}</h2><div class="seg" style="margin-top:8px">${HE.map(g=>`<button class="btn" type="button" data-he="${g}" aria-pressed="${g===st.hev}">${esc(gshort(g))}</button>`).join("")}</div><div style="margin-top:10px">${histogram(F,st.hev,isTeam,PAGE==="event"?null:D.nssa)}</div><div class="note">${esc(gname(st.hev))} · ${t("histNote").replace("PR",F.team_state)}</div></section>`; }
  // bands
  const bands=new Map();
  const add=(k,p)=>{if(!bands.has(k))bands.set(k,[]);bands.get(k).push(p);};
  for(const p of list){
    if(st.group==="class")add(personClass(p)||"~",p);
    else{const cs=personConcs(p);if(cs.length)cs.forEach(c=>add(c,p));else add("~",p);}
  }
  const keys=[...bands.keys()].sort((a,b)=>{if(a==="~")return 1;if(b==="~")return -1;
    if(st.group==="class"){const ia=CLASSES.indexOf(a),ib=CLASSES.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);}return a.localeCompare(b);});
  let shown=0;
  for(const k of keys){
    const ps=bands.get(k).sort((a,b)=>totalOf(b).b-totalOf(a).b||a.name.localeCompare(b.name));
    const lab=k==="~"?(st.group==="class"?t("noClass"):t("noConc")):(st.group==="class"?t("cls")+" "+k:t("conc")+" "+k);
    h+=`<div class="band">${esc(lab)}<span>${ps.length} ${ps.length===1?t("shooter1"):t("shooters")}</span></div>`;
    const vis=ps.slice(0,Math.max(0,st.limit-shown));shown+=vis.length;
    h+=`<div class="people cards-only">${vis.map(p=>personCard(p,evs,F)).join("")}</div>`;
    h+=`<div class="tablewrap"><div class="hint">${t("swipe")}</div><div class="scroll"><table><colgroup><col class="c-name"><col class="c-city">${evs.map(()=>`<col class="c-ev">`).join("")}<col class="c-aw"></colgroup><thead><tr><th class="l">${t("name")}</th><th class="l">${t("city")}</th>${evs.map(g=>`<th>${esc(gshort(g))}</th>`).join("")}<th class="l">${t("awards")}</th></tr></thead><tbody>
      ${vis.map(p=>`<tr class="${p.nssa===D.nssa?"me":""}"><td class="l"><b>${esc(p.name)}</b>${p.nssa===D.nssa?`<span class="youtag">${t("you")}</span>`:""}</td><td class="l">${esc(p.city)}</td>
        ${evs.map(g=>{const e=p.ev[g];return `<td>${e?`${e.b}<span class="muted">/${e.t}</span> <span class="muted small">${esc(e.c||"")}</span>`:""}</td>`;}).join("")}
        <td class="l aw">${evs.flatMap(g=>[...(p.ev[g]?.aw||[]).map(c=>`<span title="${esc(gname(g))}">${badge(c,true)}</span>`)]).join("")}</td></tr>`).join("")}
      </tbody></table></div></div>`;
    if(shown>=st.limit)break;
  }
  if(shown<list.length)h+=`<button class="btn more" type="button" id="moreBtn">${t("more")} (${list.length-shown})</button>`;
  if(!list.length)h+=`<div class="card empty">–</div>`;
  return h;
}
function totalOf(p){const e=p.ev.HAA||p.ev.HOA;return e?{g:p.ev.HAA?"HAA":"HOA",b:e.b,t:e.t}:{g:"",b:0,t:0};}
function personCard(p,evs,F){
  const me=p.nssa===D.nssa,tot=totalOf(p);
  const tiles=evs.filter(g=>g!=="HAA"&&p.ev[g]).map(g=>{const e=p.ev[g];return `<div class="tile${g==="HOA"?" total":""}" style="--gc:${gc(g)}"><div class="en">${esc(gshort(g))}${e.c?" · "+esc(e.c):""}</div><div class="sc">${e.b}<small>/${e.t}</small></div>
    ${(e.aw||[]).length?`<div class="badges">${(e.aw||[]).map(c=>badge(c,true)).join("")}</div>`:""}</div>`;}).join("");
  const haaAw=[...(p.ev.HAA?.aw||[])];
  return `<article class="card person${me?" me":""}"><div class="nm">${esc(p.name)}${me?`<span class="youtag">${t("you")}</span>`:""}</div>
    <div class="ct">${esc(p.city)}${PAGE==="event"?"":" · NSSA "+esc(p.nssa)}</div><div class="tiles">${tiles}</div>
    ${tot.t?`<div class="totalbar"><span>${t("total")} ${tot.g}${haaAw.length&&tot.g==="HAA"?" · "+haaAw.map(esc).join(" "):""}</span><b>${tot.b}<small style="font-size:12px;opacity:.8">/${tot.t} · ${fmtp(pct(tot.b,tot.t))}</small></b></div>`:""}
  </article>`;
}
function bindTeam(){
  document.querySelectorAll("[data-ti]").forEach(b=>b.onclick=()=>{st.ti=+b.dataset.ti;st.limit=60;render();});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{st.filter=b.dataset.f;st.limit=60;render();});

/* ---------- PR per-shooter view: search, A–Z, cards, deep links (#s=<slug>) ---------- */
const plink=(id,name)=>id?`<a class="plink" href="#s=${encodeURIComponent(id)}">${esc(name)}</a>`:esc(name);
function normQ(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9? ]+/g," ").replace(/\s+/g," ").trim();}
function wordIn(nm,w){for(let i=0;i+w.length<=nm.length;i++){let ok=true;for(let j=0;j<w.length;j++){const c=nm[i+j];if(c!==w[j]&&c!=="?"){ok=false;break;}}if(ok)return true;}return false;}
function nameMatch(name,q){const nm=normQ(name),ws=normQ(q).replace(/\?/g,"").split(" ").filter(Boolean);return ws.length>0&&ws.every(w=>wordIn(nm,w));}
function personById(id){return (D.pr.people||[]).find(p=>p.id===id);}
function hashState(){const h=decodeURIComponent((location.hash||"").replace(/^#/,""));return h.startsWith("s=")?{s:h.slice(2)}:{tab:h};}
function prNav(hash){if(hash.startsWith("s=")){st.letter=null;st.q="";}try{history.pushState({pr:1},"",location.pathname+location.search+"#"+hash);}catch(_){location.hash=hash;return;}st.pev=null;render();window.scrollTo(0,0);}
function searchRows(q){const P=D.pr.people||[];if(!normQ(q))return "";const m=P.filter(p=>nameMatch(p.name,q));

function tabLabel(k){const x=(D.pr.sections||[]).find(s=>s.slug===k);return x?(st.lang==="es"?x.tab_es:x.tab_en):k;}
function azRows(){const P=D.pr.people||[];const L=st.letter;if(!L)return "";
  const list=P.filter(p=>L==="*"||p.letter===L);
  return `<div class="sres">${list.map(p=>`<a class="srow2" href="#s=${encodeURIComponent(p.id)}"><b>${esc(p.sk)}</b>, ${esc(p.name.split(" ")[0])}${p.me?`<span class="youtag">${t("you")}</span>`:""}<small>${esc(p.city)}</small></a>`).join("")}</div>`;}
function renderFinder(){const P=D.pr.people||[];const letters=[...new Set(P.map(p=>p.letter))].sort();
  return `<section class="card finder" id="finder"><label for="prq" class="fl">${t("findName")}</label>

    <div id="praz">${azRows()}</div><div class="note">${P.length} ${t("shooters")} PR · ${t("azNote")}</div></section>`;}
function pTile(g,e,isTotal){if(!e)return "";const p=100*e.b/e.t;
  return `<div class="tile${isTotal?" total":""}" style="--gc:${gc(g)}"><div class="en">${esc(g==="WM"?EVN("WM"):gname(g))}</div><div class="sc">${e.b}<small>/${e.t}</small></div><div class="pc">${fmtp(p)}${e.full?"":" · "+t("partial")}</div>
    ${placePill(e.aw,e.c)}${e.aw&&e.aw.length?`<div class="badges">${e.aw.map(c=>badge(c)).join("")}</div>`:""}${e.side?`<div class="rank">${t("sideEv")}</div>`:""}
    ${e.full&&e.r?`<div class="rank">${t("overall")}: ${e.r} ${t("of")} ${e.of}${e.tie?` (${t("tieWith")} ${e.tie})`:""}</div>`:""}
    ${e.full&&e.rc&&e.c?`<div class="rank">${t("cls")} ${esc(e.c)}: ${e.rc} ${t("of")} ${e.cls_of}${e.tc?` (${t("tieWith")} ${e.tc})`:""}</div>`:""}</div>`;}
function renderShooter(p){
  if(!p)return `<section class="card"><button class="btn" type="button" data-back="1">← ${t("back")}</button><div class="empty">${t("noShooter")}</div></section>`;
  const secs=(D.pr.sections||[]).filter(s=>p.shoots[s.slug]);
  let h=`<section class="card hero" id="scard">${heroArt()}<div class="sh-head"><button class="btn" type="button" data-back="1" style="background:var(--hero-tile);color:var(--hero-ink);border-color:transparent">← ${t("back")}</button>
    <button class="btn" type="button" id="copyLink" style="background:var(--hero-tile);color:var(--hero-ink);border-color:transparent">🔗 ${t("copyLink")}</button></div>
    <div class="big" style="font-size:30px;margin-top:10px;overflow-wrap:anywhere">${esc(p.name)}${p.me?` <span class="youtag">${t("you")}</span>`:""}</div>
    <div class="sub">${esc(p.city)} · ${secs.map(s=>esc(st.lang==="es"?s.tab_es:s.tab_en)).join(" · ")}</div>
</section>`;
  for(const s of secs){const d=p.shoots[s.slug],E=d.ev;
    h+=`<section class="card"><div class="sh-head"><div class="t"><h2>${esc(st.lang==="es"?s.tab_es:s.tab_en)}</h2><div class="muted small">${esc(s.name)} · ${esc(fmtDate(s.start,s.end))}</div></div><span class="pill ok">✓ ${t("official")}</span></div>
      <div class="tiles">${["HOA","HAA"].map(g=>pTile(g,E[g],true)).join("")}${GAUGES.map(g=>pTile(g,E[g],false)).join("")}${pTile("WM",E.WM,false)}</div>`;
    if(d.squads==null)h+=`<div class="note">${t("sqNAshooter")}</div>`;
    else if(!d.squads.length)h+=`<div class="note">${t("sqNone")}</div>`;
    else h+=`<h3 style="margin-top:12px">${t("sqDay")}</h3><div class="sched">${d.squads.map(z=>{const [wd,dm]=dayLab(z.day);return `<div class="srow"><div class="d">${esc(wd)}<small>${esc(dm)}</small></div><div><div class="e">${esc(EVN(z.event))}</div><div class="kv"><span>${t("sq")} <b>${esc(z.squad)}</b>${z.pos?` · ${t("posn")} ${esc(z.pos)}`:""}</span><span>${t("time")} <b>${esc(z.time||"–")}</b></span></div></div></div>`;}).join("")}</div><div class="note">${t("sqSrc")}</div>`;
    h+=`</section>`;}
  if(p.combined){const C=p.combined;
    h+=`<section class="card"><h2>${t("combBest")}</h2><div class="muted small" style="margin-bottom:8px">${t("combBestNote")}</div><div class="bars">${["HOA","HAA",...GAUGES].filter(g=>C.best[g]).map(g=>{const b=C.best[g];return `<div class="brow"><span>${esc(gname(g))}</span><div class="barbg"><i style="width:${b.pct}%;background:${gc(g)}"></i></div><b>${fmtp(b.pct)} <span class="muted">${esc(tabLabel(b.shoot))}</span></b></div>`;}).join("")}</div>
      <h3 style="margin-top:12px">${t("haaChange")}</h3>${C.haa?`<div class="lb">${lbRow(C.haa.delta>=0?"▲":"▼",`${C.haa.delta>0?"+":""}${(Math.round(C.haa.delta*10)/10).toLocaleString(st.lang==="es"?"es-PR":"en-US")} ${t("pts")}`,`${esc(tabLabel(C.haa.first.shoot))} ${C.haa.first.b}/${C.haa.first.t} (${fmtp(100*C.haa.first.b/C.haa.first.t)}) → ${esc(tabLabel(C.haa.last.shoot))} ${C.haa.last.b}/${C.haa.last.t} (${fmtp(100*C.haa.last.b/C.haa.last.t)})`,"",false)}</div>`:`<div class="note">${t("haaNA")}</div>`}</section>`;}
  h+=`<div class="note">${t("privNote")}</div>`;
  return h;
}
function toast(msg){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.textContent=msg;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),1800);}
function copyText(txt){
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(_){}ta.remove();
    if(ok)toast(t("copied"));else{window.prompt(t("copyManual"),txt);}};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),fallback);else fallback();}
function shooterURL(id){return location.origin+location.pathname+"?lang="+st.lang+"#s="+encodeURIComponent(id);}

/* ---------------- PR page (one tab per shoot + cross-shoot "combined") ---------------- */
function lbRow(i,name,sub,v,me,id,bar){return `<div class="lbr${me?" me":""}"${bar?` style="--gc:${bar.c}"`:""}>${bar?`<span class="hb" style="width:${Math.max(0,Math.min(100,bar.w)).toFixed(1)}%"></span>`:""}<span class="n">${i}</span><span class="nm">${id?plink(id,name):esc(name)}${me?`<span class="youtag">${t("you")}</span>`:""}<small>${sub}</small></span><span class="v">${v}</span></div>`;}
function rankList(rows,score){let prev=null,rk=0;return rows.map((r,i)=>{const k=score(r);if(k!==prev){rk=i+1;prev=k;}return [rk,r];});}
function prTabs(P){const tabs=[...P.sections.map(x=>[x.slug,st.lang==="es"?x.tab_es:x.tab_en]),["combined",t("combTab")]];
  return `<nav class="tabs" role="tablist" aria-label="${esc(t("prTitle"))}">${tabs.map(([k,l])=>`<a role="tab" href="#${k}" data-tab="${k}" aria-selected="${k===st.ptab}" class="${k===st.ptab?"on":""}${k==="combined"?" sec":""}">${esc(l)}</a>`).join("")}</nav>`;}
function curTab(P){const h=hashState().tab||"";const ok=[...P.sections.map(x=>x.slug),...(P.sections.length>1?["combined"]:[])];return ok.includes(h)?h:P.sections[0].slug;}
function medalTable(people,showShoot){
  const M=byCombined(people);if(!M.length)return `<div class="muted small">–</div>`;
  const rp=n=>`${n||0}`;
  const S=k=>M.reduce((n,p)=>n+(p[k]||0),0);
  const G={gold:S("gold"),silver:S("silver"),bronze:S("bronze"),other:S("other")};
  const GT=G.gold+G.silver+G.bronze+G.other,side=M.reduce((n,p)=>n+p.awards.filter(a=>a.event==="WM").length,0);
  return `<h3 style="margin-top:16px">${t("tableT")}</h3><div class="mt" style="margin-top:6px" role="table" aria-label="${esc(t("tableT"))}"><span class="hd" style="text-align:left">${t("name")}</span><span class="hd" title="${t("gold")}">${medalIcon(1,16)}</span><span class="hd" title="${t("silver")}">${medalIcon(2,16)}</span><span class="hd" title="${t("bronze")}">${medalIcon(3,16)}</span><span class="hd">${t("other")}</span><span class="hd tt">${t("total")}</span>
    ${M.map(p=>`<span class="nm">${plink(p.nssa,p.name)}${p.nssa===D.nssa?`<span class="youtag">${t("you")}</span>`:""}</span><span class="ct">${rp(p.gold)}</span><span class="ct">${rp(p.silver)}</span><span class="ct">${rp(p.bronze)}</span><span class="ct muted">${rp(p.other)}</span><span class="ct tt">${rp(ctot(p))}</span>`).join("")}
    <span class="nm gt">${t("total")} · ${M.length} ${t("shooters")}</span><span class="ct gt">${rp(G.gold)}</span><span class="ct gt">${rp(G.silver)}</span><span class="ct gt">${rp(G.bronze)}</span><span class="ct muted gt">${rp(G.other)}</span><span class="ct tt gt">${rp(GT)}</span></div>
    <div class="note"><b>${t("awTot")}: ${GT}</b> · ${t("medInc")}: ${G.gold+G.silver+G.bronze} · ${t("other")}: ${G.other}${side?` · ${t("incWM").replace("N",side)}`:""}</div>
    <div class="note">${t("combNote")} ${t("medalNote")}</div>
    <details style="margin-top:10px"><summary><b>${t("placements")}</b> (${M.length})</summary>${M.map(p=>`<div style="margin:8px 0"><b>${plink(p.nssa,p.name)}</b> <span class="muted small">${esc(p.city)}</span><div class="badges" style="margin-top:4px">${p.awards.map(a=>`<span title="${esc(a.shoot)} · ${esc(gname(a.event))}">${badge(a.code,true)}</span><span class="muted small" style="align-self:center">${esc(gshort(a.event))}${a.b!=null?" "+a.b+"/"+a.t:""}${showShoot?" · "+esc(a.shoot.replace(/^2026 /,"").replace(/ CHAMPIONSHIPS?$/,"")):""}</span>`).join("")}</div></div>`).join("")}</details>`;}
function medalSum(people){return {m:people.reduce((a,p)=>a+p.gold+p.silver+p.bronze,0),r:0,aw:people.reduce((a,p)=>a+p.awards.length,0),ra:0};}
let lbLo=0;const lbW=v=>Math.max(2,100*(v-lbLo)/(100-lbLo));
function renderPRSection(x){
  const ms=medalSum(x.people),top=x.people.find(p=>p.awards.length);
  let h=`<section class="card hero">${heroArt()}<div class="lbl">${esc(x.name)} · ${esc(fmtDate(x.start,x.end))}</div><div class="big"><span data-cu="${x.n}">${x.n}</span><small> ${t("shooters")} PR</small></div>
    <div class="sub">${t("of2")} ${x.field_n} ${t("fieldOf")} · ${t("official")}</div>
    <div class="stats"><div class="stat"><b>${x.best.HOA[0]?x.best.HOA[0].b:"–"}</b><span>${t("hoaTop")}${x.best.HOA[0]?" · "+esc(x.best.HOA[0].name):""}</span></div>
    <div class="stat"><b>${x.best.HAA[0]?x.best.HAA[0].b:"–"}</b><span>${t("haaTop")}${x.best.HAA[0]?" · "+esc(x.best.HAA.filter(r=>r.b===x.best.HAA[0].b).map(r=>r.name).join(", ")):""}</span></div>
    <div class="stat"><b>${plusRep(ms.aw,ms.ra)}</b><span>${t("awTot")}<small>${t("awTotSub")}</small></span></div>
    <div class="stat"><b>${plusRep(ms.m,ms.r)}</b><span>${t("medInc").replace(/ \(.*\)$/,"")}<small>${(t("medInc").match(/\((.*)\)$/)||["",""])[1]}</small></span></div></div></section>`;
  // HOA / HAA top
  const topL=(key,title)=>{const rows=x.best[key]||[];const lo=rows.length?Math.max(0,Math.floor((Math.min(...rows.map(r=>r.pct))-4)/5)*5):0;return `<div><h3>${title}</h3><div class="lb">${rankList(rows,r=>r.b).map(([k,r])=>lbRow(k,r.name,`${r.c?t("cls")+" "+esc(r.c):""}${r.aw.length?" · "+r.aw.map(esc).join(" "):""}`,`${r.b}<small>/${r.t} · ${fmtp(r.pct)}</small>`,r.nssa===D.nssa,r.nssa,{w:Math.max(2,100*(r.pct-lo)/(100-lo)),c:gc(key)})).join("")||`<div class="muted small">–</div>`}</div></div>`;};
  h+=`<section class="card"><div class="grid2">${topL("HOA",t("hoaTop"))}${topL("HAA",t("haaTop"))}</div></section>`;
  // medals: podium + stacked bars + combined table
  h+=`<section class="card" id="medals"><h2>${t("medals")}</h2><div class="muted small">${t("podium")}</div>${podium(x.people)}<h3 style="margin-top:14px">${t("stackT")}</h3>${stacked(x.people,10)}${medalTable(x.people,false)}${(x.side_events||[]).length?`<div class="note">${t("wmNote")}</div>`:""}</section>`;
  // best per gauge
  h+=`<section class="card"><h2>${t("bestG")}</h2><div class="tiles">${["12","20","28","410","DBL"].map(g=>{const rows=x.best[g]||[];if(!rows.length)return "";const b=rows[0];const ties=rows.filter(r=>r.b===b.b);
    return `<div class="tile" style="--gc:${gc(g)}"><div class="en">${esc(gname(g))}</div><div class="sc">${b.b}<small>/${b.t}</small></div><div class="pc">${fmtp(b.pct)}</div>${ties.map(r=>`<div class="small"><b>${plink(r.nssa,r.name)}</b>${r.nssa===D.nssa?`<span class="youtag">${t("you")}</span>`:""}${r.c?` <span class="muted">· ${esc(r.c)}</span>`:""}</div>`).join("")}</div>`;}).join("")}</div></section>`;
  // best squad
  h+=`<section class="card"><h2>${t("bestSq")}</h2>`;
  if(!x.squads.length)h+=`<div class="note">${t("sqNA")}</div>`;
  else{h+=`<div class="lb" style="margin-top:8px">`;
    for(const g of ["12","20","28","410","DBL"]){const sq=x.squads.filter(z=>z.event===g);if(!sq.length)continue;
      const full=sq.filter(z=>z.all_pr).sort((a,b)=>b.total-a.total),b=full[0]||[...sq].sort((a,b)=>b.n-a.n||b.total-a.total)[0];
      h+=lbRow(gshort(g),`${t("sq")} ${b.squad}`,`${b.members.map(m=>esc(m.name.split(" ").slice(-1)[0])+" "+m.b).join(" · ")} · ${b.all_pr?t("sqFull"):b.n+" "+t("sqPart")}`,`${b.total}<small>/${b.targets} · ${fmtp(100*b.total/b.targets)}</small>`,b.members.some(m=>m.nssa===D.nssa));}
    h+=`</div><div class="note">${t("sqNote")}</div>`;}
  h+=`</section>`;
  // class distribution
  h+=`<section class="card"><h2>${t("classDist")}</h2>${classDonut(x.classes)}${x.classes["–"]?`<div class="note">${t("noHOAnote")}</div>`:""}</section>`;
  // leaderboard per event
  if(!x.events.includes(st.pev))st.pev=x.events.includes("HOA")?"HOA":x.events[0];
  const fullT=x.meta[st.pev]?.full_shot;
  const rows=x.shooters.filter(p=>p.ev[st.pev]).sort((a,b)=>b.ev[st.pev].b-a.ev[st.pev].b||a.name.localeCompare(b.name));
  h+=`<section class="card" id="leader"><h2>${t("leader")}</h2><div class="seg" style="margin-top:8px">${x.events.map(g=>`<button class="btn" type="button" data-pe="${g}" aria-pressed="${g===st.pev}">${esc(gshort(g))}</button>`).join("")}</div>
    <div class="lb" style="margin-top:10px">${(()=>{const ps=rows.map(p=>100*p.ev[st.pev].b/p.ev[st.pev].t);lbLo=Math.max(0,Math.floor((Math.min(...ps)-4)/5)*5);return "";})()}${rankList(rows,p=>p.ev[st.pev].t===fullT?p.ev[st.pev].b:-1-p.ev[st.pev].t).map(([k,p])=>{const e=p.ev[st.pev];const part=e.t!==fullT;
      const ra=[];
      return lbRow(part?"·":k,p.name,`${esc(p.city)}${e.c?" · "+t("cls")+" "+esc(e.c):""}${(e.aw||[]).length||ra.length?" · "+[...(e.aw||[]).map(esc),...ra].join(" "):""}`,`${e.b}<small>/${e.t}${part?"":" · "+fmtp(100*e.b/e.t)}</small>`,p.nssa===D.nssa,p.nssa,{w:lbW(100*e.b/e.t),c:gc(st.pev)});}).join("")}</div>
    <div class="note">${esc(gname(st.pev))} · ${rows.length} ${t("shooters")} · ${t("official")} · ${t("lbNote")} ${lbLo}%–100%</div></section>`;
  return h;
}
function renderPRCombined(P){
  const C=P.combined,ms=medalSum(C.people);
  let h=`<section class="card"><div class="banner so" style="margin:0 0 10px">${t("combBanner")}</div><h2>${t("combTitle")}</h2>
    <div class="stats" style="margin-top:10px">${[[C.n_unique,t("uniq")],[C.in_all,t("inAll")],[plusRep(ms.m,ms.r),t("medalsN")],[plusRep(ms.aw,ms.ra),t("awards")]].map(([v,l])=>`<div class="stat" style="background:var(--card2);border:1px solid var(--line)"><b>${v}</b><span style="color:var(--muted)">${esc(l)}</span></div>`).join("")}</div>
    <h3 style="margin-top:14px">${t("perShoot")}</h3><div class="bars">${C.per_shoot.map(x=>`<div class="brow"><span class="small">${esc(P.sections.find(s=>s.slug===x.slug)[st.lang==="es"?"tab_es":"tab_en"])}</span><div class="barbg"><i style="width:${100*x.n/Math.max(...C.per_shoot.map(y=>y.n))}%"></i></div><b>${x.n} <span class="muted">/ ${x.field_n}</span></b></div>`).join("")}</div></section>`;
  h+=`<section class="card"><h2>${t("improved")}</h2>`;
  if(C.improved&&C.improved.length){h+=`<div class="lb" style="margin-top:8px">${C.improved.slice(0,8).map((r,i)=>lbRow(i+1,r.name,`${r.event}: ${r.first.b}/${r.first.t} (${esc(r.first.shoot.replace(/^2026 /,""))}) → ${r.last.b}/${r.last.t} (${esc(r.last.shoot.replace(/^2026 /,""))})`,`${r.delta>0?"+":""}${(Math.round(r.delta*10)/10).toLocaleString(st.lang==="es"?"es-PR":"en-US")} <small>${t("pts")}</small>`,r.nssa===D.nssa,r.nssa)).join("")}</div><div class="note">${t("impNote")}</div>`;}
  else h+=`<div class="note">${t("impNA")}</div>`;
  h+=`</section><section class="card"><h2>${t("medals")} · ${t("combTab")}</h2>${medalTable(C.people,true)}</section>`;
  return h;
}
function renderPR(){
  const P=D.pr;if(!P||!P.sections||!P.sections.length)return `<div class="card empty">${t("noField")}</div>`;
  const hs=hashState();
  if(hs.s){const p=personById(hs.s);document.title=(p?p.name+" · ":"")+t("prTitle");return renderShooter(p)+renderFinder();}
  st.ptab=curTab(P);
  const x=P.sections.find(s=>s.slug===st.ptab);
  return renderFinder()+(P.sections.length>1?prTabs(P):"")+(x?renderPRSection(x):renderPRCombined(P));
}
function renderEvent(){
  const P=D.pr,hs=hashState();
  if(hs.s){const p=personById(hs.s);document.title=(p?p.name+" · ":"")+(st.lang==="es"?D.event.title_es:D.event.title_en);return renderShooter(p)+renderFinder();}
  st.etab=hs.tab==="field"?"field":"pr";
  const tabs=[["pr",t("tabSum")],["field",t("tabField")]];
  const nav=`<nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<a role="tab" href="#${k}" data-tab="${k}" aria-selected="${k===st.etab}" class="${k===st.etab?"on":""}">${esc(l)}</a>`).join("")}</nav>`;
  return renderFinder()+nav+(st.etab==="field"?renderTeam():(P.sections[0]?renderPRSection(P.sections[0]):`<div class="card empty">${t("noField")}</div>`));
}
function bindPR(){
  document.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>{st.pev=b.dataset.pe;render();document.getElementById("leader").scrollIntoView();});
  const q=document.getElementById("prq");if(q)q.oninput=()=>{st.q=q.value;document.getElementById("prres").innerHTML=searchRows(st.q);};
  document.querySelectorAll("[data-az]").forEach(b=>b.onclick=()=>{st.letter=st.letter===b.dataset.az?null:b.dataset.az;
    document.querySelectorAll("[data-az]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.az===st.letter));document.getElementById("praz").innerHTML=azRows();});
  document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{if(history.state&&history.state.pr)history.back();else prNav(PAGE==="event"?"pr":D.pr.sections[0].slug);});
  const c=document.getElementById("copyLink");if(c)c.onclick=()=>copyText(shooterURL(hashState().s));
}
if(PAGE==="pr"||PAGE==="event"){
  document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('#app a[href^="#"]');if(!a)return;e.preventDefault();prNav(decodeURIComponent(a.getAttribute("href").slice(1)));});
  window.addEventListener("popstate",()=>{st.pev=null;render();});
  window.addEventListener("hashchange",()=>{st.pev=null;render();});
}

function renderFoot(){
  const C=D.checked||[];
  document.getElementById("foot").innerHTML=`<details class="checked card"><summary>${t("checked")}: ${C.length} · ${C.filter(c=>c.present).length} ${t("present")}</summary><ul>
    ${C.map(c=>`<li>${c.present?"✅":"—"} ${esc(c.report_id)} ${c.present?t("present"):t("absent")}</li>`).join("")}</ul></details>
    <div style="margin-bottom:6px">${t("rankNote")}</div><div>${t("source")}: <a href="https://iskeet.org/shoot_reports/index.php" rel="noopener">iskeet.org/shoot_reports</a> · ${t("generated")}: ${esc((D.generated_at||"").replace("T"," ").replace(/[+-]\d\d:\d\d$/,""))} AST</div>`;
}
function render(){
  document.documentElement.lang=st.lang;
  const TT=PAGE==="team"?t("teamTitle"):PAGE==="pr"?t("prTitle"):PAGE==="event"?(st.lang==="es"?D.event.title_es:D.event.title_en):t("title");
  document.title=PAGE==="event"?TT:TT+(PAGE==="pr"?" · NSSA":" · NSSA "+D.nssa);
  document.getElementById("title").innerHTML=PAGE==="pr"?`${TT}<small>${t("prSub")}</small>`:PAGE==="event"?`${TT}<small>${t("evSub")}</small>`:`${TT}<small>${esc(D.shooter_name||"")} · ${t("sub")} ${esc(D.nssa)}</small>`;
  const lb=document.getElementById("langBtn");lb.textContent=st.lang==="es"?"English":"Español";
  lb.onclick=()=>{st.lang=st.lang==="es"?"en":"es";setLang(st.lang);try{history.replaceState(history.state,"",location.pathname+"?lang="+st.lang+location.hash);}catch(e){}render();};
  renderNav();
  const AK=location.hash+"|"+(PAGE==="pr"||PAGE==="event"?"":st.lang),app=document.getElementById("app");app.classList.toggle("noanim",render._k===AK||RM());render._k=AK;
  document.getElementById("app").innerHTML=PAGE==="team"?renderTeam():PAGE==="pr"?renderPR():PAGE==="event"?renderEvent():(typeof renderMe==="function"?renderMe():"");
  if(PAGE==="team")bindTeam();if(PAGE==="pr")bindPR();if(PAGE==="event"){bindPR();if(st.etab==="field"&&!hashState().s)bindTeam();}
  renderFoot();countUp();
}
