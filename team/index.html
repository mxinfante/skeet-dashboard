  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("trend")}">
    <line class="base" x1="${px}" x2="${W-px}" y1="${H-4}" y2="${H-4}" stroke-width="1"/>

    const ps=bands.get(k).sort((a,b)=>totalOf(b).b-totalOf(a).b||a.name.localeCompare(b.name));
    const lab=k==="~"?(st.group==="class"?t("noClass"):t("noConc")):(st.group==="class"?t("cls")+" "+k:t("conc")+" "+k);
    h+=`<div class="band">${esc(lab)}<span>${ps.length} ${ps.length===1?t("shooter1"):t("shooters")}</span></div>`;
    const vis=ps.slice(0,Math.max(0,st.limit-shown));shown+=vis.length;
    h+=`<div class="people cards-only">${vis.map(p=>personCard(p,evs,F)).join("")}</div>`;
    h+=`<div class="tablewrap"><div class="hint">${t("swipe")}</div><div class="scroll"><table><colgroup><col class="c-name"><col class="c-city">${evs.map(()=>`<col class="c-ev">`).join("")}<col class="c-aw"></colgroup><thead><tr><th class="l">${t("name")}</th><th class="l">${t("city")}</th>${evs.map(g=>`<th>${esc(gshort(g))}</th>`).join("")}<th class="l">${t("awards")}</th></tr></thead><tbody>
      ${vis.map(p=>`<tr class="${p.nssa===D.nssa?"me":""}"><td class="l"><b>${esc(p.name)}</b>${p.nssa===D.nssa?`<span class="youtag">${t("you")}</span>`:""}</td><td class="l">${esc(p.city)}</td>
        ${evs.map(g=>{const e=p.ev[g];return `<td>${e?`${e.b}<span class="muted">/${e.t}</span> <span class="muted small">${esc(e.c||"")}</span>`:""}</td>`;}).join("")}
        <td class="l aw">${evs.flatMap(g=>(p.ev[g]?.aw||[]).map(c=>`<span title="${esc(gname(g))}">${badge(c,true)}</span>`)).join("")}</td></tr>`).join("")}
      </tbody></table></div></div>`;
    if(shown>=st.limit)break;
  }
  if(shown<list.length)h+=`<button class="btn more" type="button" id="moreBtn">${t("more")} (${list.length-shown})</button>`;
  if(!list.length)h+=`<div class="card empty">–</div>`;
  return h;
}
function totalOf(p){const e=p.ev.HAA||p.ev.HOA;return e?{g:p.ev.HAA?"HAA":"HOA",b:e.b,t:e.t}:{g:"",b:0,t:0};}
function personCard(p,evs,F){
  const me=p.nssa===D.nssa,tot=totalOf(p);
  const tiles=evs.filter(g=>g!=="HAA"&&p.ev[g]).map(g=>{const e=p.ev[g];return `<div class="tile${g==="HOA"?" total":""}"><div class="en">${esc(gshort(g))}${e.c?" · "+esc(e.c):""}</div><div class="sc">${e.b}<small>/${e.t}</small></div>
    ${(e.aw||[]).length?`<div class="badges">${e.aw.map(c=>badge(c,true)).join("")}</div>`:""}</div>`;}).join("");
  const haaAw=(p.ev.HAA?.aw||[]);
  return `<article class="card person${me?" me":""}"><div class="nm">${esc(p.name)}${me?`<span class="youtag">${t("you")}</span>`:""}</div>
    <div class="ct">${esc(p.city)} · NSSA ${esc(p.nssa)}</div><div class="tiles">${tiles}</div>
    ${tot.t?`<div class="totalbar"><span>${t("total")} ${tot.g}${haaAw.length&&tot.g==="HAA"?" · "+haaAw.map(esc).join(" "):""}</span><b>${tot.b}<small style="font-size:12px;opacity:.8">/${tot.t} · ${fmtp(pct(tot.b,tot.t))}</small></b></div>`:""}
  </article>`;
}
function bindTeam(){
  document.querySelectorAll("[data-ti]").forEach(b=>b.onclick=()=>{st.ti=+b.dataset.ti;st.limit=60;render();});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{st.filter=b.dataset.f;st.limit=60;render();});
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{st.group=b.dataset.g;st.limit=60;render();});
  const q=document.getElementById("q");if(q){q.oninput=()=>{st.q=q.value;st.limit=60;const pos=q.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos);};}
  const m=document.getElementById("moreBtn");if(m)m.onclick=()=>{st.limit+=60;render();};
  updateHints();
}
function updateHints(){document.querySelectorAll(".tablewrap").forEach(w=>{const sc=w.querySelector(".scroll"),hn=w.querySelector(".hint");if(sc&&hn)hn.classList.toggle("on",sc.scrollWidth>sc.clientWidth+2);});}
window.addEventListener("resize",updateHints);
/* ---------------- PR page ---------------- */
function lbRow(i,name,sub,v,me){return `<div class="lbr${me?" me":""}"><span class="n">${i}</span><span class="nm">${esc(name)}${me?`<span class="youtag">${t("you")}</span>`:""}<small>${sub}</small></span><span class="v">${v}</span></div>`;}
function rankList(rows,score){let prev=null,rk=0;return rows.map((r,i)=>{const k=score(r);if(k!==prev){rk=i+1;prev=k;}return [rk,r];});}
function renderPR(){
  const P=D.pr;if(!P||!P.shoots.length)return `<div class="card empty">${t("noField")}</div>`;
  const nMed=P.people.reduce((a,p)=>a+p.gold+p.silver+p.bronze,0);
  let h=`<section class="card hero"><div class="lbl">${t("prSub")}</div><div class="big">${P.n_unique}<small> ${t("shooters")}</small></div>
    <div class="stats"><div class="stat"><b>${P.shoots.length}</b><span>${t("shoots")}</span></div>
    ${P.shoots.map(x=>`<div class="stat"><b>${x.n}</b><span>${esc(x.name)}</span></div>`).join("")}
    <div class="stat"><b>${nMed}</b><span>${t("medalsN")}</span></div></div></section>`;
  // per shoot + class distribution
  h+=`<section class="card"><h2>${t("perShoot")}</h2><div class="bars" style="margin:8px 0 12px">${P.shoots.map(x=>`<div class="brow"><span class="small">${esc(x.name.replace(/^2026 /,""))}</span><div class="barbg"><i style="width:${100*x.n/Math.max(...P.shoots.map(y=>y.n))}%"></i></div><b>${x.n} <span class="muted">/ ${x.field_n}</span></b></div>`).join("")}</div>
    <h3>${t("classDist")}</h3>${P.shoots.map(x=>`<div class="small muted" style="margin:6px 0 4px">${esc(x.name)} · ${esc(fmtDate(x.start,x.end))}</div><div class="cd">${[...CLASSES,"–"].filter(c=>x.classes[c]).map(c=>`<span>${c==="–"?t("noHOA"):t("cls")+" "+c} <small>· ${x.classes[c]}</small></span>`).join("")}</div>`).join("")}</section>`;
  // HOA / HAA top
  const top=(key,title)=>{const rows=P.best[key]||[];return `<div><h3>${title}</h3><div class="lb">${rankList(rows,r=>r.pct).map(([k,r])=>lbRow(k,r.name,`${esc(r.shoot)}${r.c?" · "+t("cls")+" "+esc(r.c):""}`,`${r.b}<small>/${r.t} · ${fmtp(r.pct)}</small>`,r.nssa===D.nssa)).join("")||`<div class="muted small">–</div>`}</div></div>`;};
  h+=`<section class="card"><div class="grid2">${top("HOA",t("hoaTop"))}${top("HAA",t("haaTop"))}</div><div class="note">${t("rankNote")}</div></section>`;
  // best per gauge
  h+=`<section class="card"><h2>${t("bestG")}</h2><div class="tiles">${["12","20","28","410","DBL"].map(g=>{const rows=P.best[g]||[];if(!rows.length)return "";const b=rows[0];const ties=rows.filter(r=>r.pct===b.pct);
    return `<div class="tile"><div class="en">${esc(gname(g))}</div><div class="sc">${b.b}<small>/${b.t}</small></div><div class="pc">${fmtp(b.pct)}</div>${ties.map(r=>`<div class="small"><b>${esc(r.name)}</b>${r.nssa===D.nssa?`<span class="youtag">${t("you")}</span>`:""}<br><span class="muted">${esc(r.shoot)}</span></div>`).join("")}</div>`;}).join("")}</div></section>`;
  // medal table
  const M=P.people.filter(p=>p.awards.length);
  h+=`<section class="card"><h2>${t("medals")}</h2><div class="mt" style="margin-top:8px"><span class="hd" style="text-align:left">${t("name")}</span><span class="hd"><i class="dot g"></i></span><span class="hd"><i class="dot s"></i></span><span class="hd"><i class="dot b"></i></span><span class="hd">${t("other")}</span>
    ${M.map(p=>`<span class="nm">${esc(p.name)}${p.nssa===D.nssa?`<span class="youtag">${t("you")}</span>`:""}</span><span class="ct">${p.gold||""}</span><span class="ct">${p.silver||""}</span><span class="ct">${p.bronze||""}</span><span class="ct muted">${p.other||""}</span>`).join("")}</div>
    <div class="note">${t("medalNote")}</div>
    <details style="margin-top:10px"><summary><b>${t("placements")}</b> (${M.length})</summary>${M.map(p=>`<div style="margin:8px 0"><b>${esc(p.name)}</b> <span class="muted small">${esc(p.city)}</span><div class="badges" style="margin-top:4px">${p.awards.map(a=>`<span title="${esc(a.shoot)} · ${esc(gname(a.event))}">${badge(a.code,true)}</span><span class="muted small" style="align-self:center">${esc(gshort(a.event))} ${a.b}/${a.t} · ${esc(a.shoot.replace(/^2026 /,"").replace(/ CHAMPIONSHIPS?$/,""))}</span>`).join("")}</div></div>`).join("")}</details></section>`;
  // best squad
  h+=`<section class="card"><h2>${t("bestSq")}</h2>`;
  for(const x of P.shoots){h+=`<div class="small muted" style="margin:8px 0 4px"><b>${esc(x.name)}</b></div>`;
    if(!x.squads.length){h+=`<div class="note" style="margin-top:0">${t("sqNA")}</div>`;continue;}
    h+=`<div class="lb">`;
    for(const g of ["12","20","28","410","DBL"]){const sq=x.squads.filter(z=>z.event===g).sort((a,b)=>(b.all_pr-a.all_pr)||(b.total-a.total));if(!sq.length)continue;
      const full=sq.filter(z=>z.all_pr).sort((a,b)=>b.total-a.total),b=full[0]||sq[0];
      h+=lbRow(gshort(g),`${t("sq")} ${b.squad}`,`${b.members.map(m=>esc(m.name.split(" ").slice(-1)[0])+" "+m.b).join(" · ")} · ${b.all_pr?t("sqFull"):b.n+" "+t("sqPart")}`,`${b.total}<small>/${b.targets} · ${fmtp(100*b.total/b.targets)}</small>`,b.members.some(m=>m.nssa===D.nssa));}
    h+=`</div>`;}
  h+=`<div class="note">${t("sqNote")}</div></section>`;
  // most improved
  h+=`<section class="card"><h2>${t("improved")}</h2>`;
  if(P.improved&&P.improved.length){h+=`<div class="lb" style="margin-top:8px">${P.improved.slice(0,8).map((r,i)=>lbRow(i+1,r.name,`${r.event}: ${r.first.b}/${r.first.t} (${esc(r.first.shoot.replace(/^2026 /,""))}) → ${r.last.b}/${r.last.t} (${esc(r.last.shoot.replace(/^2026 /,""))})`,`${r.delta>0?"+":""}${(Math.round(r.delta*10)/10).toLocaleString(st.lang==="es"?"es-PR":"en-US")} <small>${t("pts")}</small>`,r.nssa===D.nssa)).join("")}</div><div class="note">${t("impNote")}</div>`;}
  else h+=`<div class="note">${t("impNA")}</div>`;
  h+=`</section>`;
  // leaderboard per event
  if(st.pshoot==null||st.pshoot>=P.shoots.length)st.pshoot=0;const x=P.shoots[st.pshoot];if(!x.events.includes(st.pev))st.pev=x.events.includes("HOA")?"HOA":x.events[0];
  const full=x.meta[st.pev]?.full_shot;
  const rows=x.shooters.filter(p=>p.ev[st.pev]).sort((a,b)=>b.ev[st.pev].b-a.ev[st.pev].b||a.name.localeCompare(b.name));
  h+=`<section class="card" id="leader"><h2>${t("leader")}</h2><div class="controls" style="margin-top:8px"><div class="seg">${P.shoots.map((y,i)=>`<button class="btn" type="button" data-ps="${i}" aria-pressed="${i===st.pshoot}">${esc(y.name.replace(/^2026 /,""))}</button>`).join("")}</div>
    <div class="seg">${x.events.map(g=>`<button class="btn" type="button" data-pe="${g}" aria-pressed="${g===st.pev}">${esc(gshort(g))}</button>`).join("")}</div></div>
    <div class="lb" style="margin-top:10px">${rankList(rows,p=>p.ev[st.pev].t===full?p.ev[st.pev].b:-1-p.ev[st.pev].t).map(([k,p])=>{const e=p.ev[st.pev];const part=e.t!==full;
      return lbRow(part?"·":k,p.name,`${esc(p.city)}${e.c?" · "+t("cls")+" "+esc(e.c):""}${(e.aw||[]).length?" · "+e.aw.map(esc).join(" "):""}`,`${e.b}<small>/${e.t}${part?"":" · "+fmtp(100*e.b/e.t)}</small>`,p.nssa===D.nssa);}).join("")}</div>
    <div class="note">${esc(x.name)} · ${esc(gname(st.pev))} · ${rows.length} ${t("shooters")} · ${t("official")}</div></section>`;
  return h;
}
function bindPR(){
  document.querySelectorAll("[data-ps]").forEach(b=>b.onclick=()=>{st.pshoot=+b.dataset.ps;render();document.getElementById("leader").scrollIntoView();});
  document.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>{st.pev=b.dataset.pe;render();document.getElementById("leader").scrollIntoView();});
}

function renderFoot(){
  const C=D.checked||[];
  document.getElementById("foot").innerHTML=`<details class="checked card"><summary>${t("checked")}: ${C.length} · ${C.filter(c=>c.present).length} ${t("present")}</summary><ul>
    ${C.map(c=>`<li>${c.present?"✅":"—"} ${esc(c.report_id)} ${c.present?t("present"):t("absent")}</li>`).join("")}</ul></details>
    <div style="margin-bottom:6px">${t("rankNote")}</div><div>${t("source")}: <a href="https://iskeet.org/shoot_reports/index.php" rel="noopener">iskeet.org/shoot_reports</a> · ${t("generated")}: ${esc((D.generated_at||"").replace("T"," ").replace(/[+-]\d\d:\d\d$/,""))} AST</div>`;
}
function render(){
  document.documentElement.lang=st.lang;
  const TT=PAGE==="team"?t("teamTitle"):PAGE==="pr"?t("prTitle"):t("title");
  document.title=TT+(PAGE==="pr"?" · NSSA":" · NSSA "+D.nssa);
  document.getElementById("title").innerHTML=PAGE==="pr"?`${TT}<small>${t("prSub")}</small>`:`${TT}<small>${esc(D.shooter_name||"")} · ${t("sub")} ${esc(D.nssa)}</small>`;
  const lb=document.getElementById("langBtn");lb.textContent=st.lang==="es"?"English":"Español";
  lb.onclick=()=>{st.lang=st.lang==="es"?"en":"es";setLang(st.lang);try{history.replaceState(null,"",location.pathname+"?lang="+st.lang);}catch(e){}render();};
  renderNav();
  document.getElementById("app").innerHTML=PAGE==="team"?renderTeam():PAGE==="pr"?renderPR():renderMe();
  if(PAGE==="team")bindTeam();if(PAGE==="pr")bindPR();
  renderFoot();
}
render();
</script>
