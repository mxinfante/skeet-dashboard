*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.wrap{max-width:960px;margin:0 auto;padding:12px 12px 40px}

.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}

a.big-card .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);display:grid;place-items:center;color:var(--accent)}
a.big-card h2{margin:4px 0 0;font-size:20px}
a.big-card p{margin:0;color:var(--muted);font-size:14px}
a.big-card .go{margin-top:auto;font-weight:700;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;position:relative;z-index:1}
.chip{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
footer{font-size:12px;color:var(--muted);margin-top:16px}
a{color:var(--accent)}

.btn{min-height:40px;padding:8px 14px;font-size:14px}

.top .ev{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.top .sc{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.top .sc small{font-size:14px;font-weight:600;color:var(--muted)}
.top .pc{font-size:12px;color:var(--muted)}
.top .who{font-size:13px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.sqbox{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}

.sqbadge small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em}.sqbadge b{font-size:22px}
.sqmain{min-width:0;flex:1 1 180px}.sqmain .sc{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.sqmain .sc small{font-size:14px;color:var(--muted);font-weight:600}
.cap{font-size:12px;color:var(--muted);margin-top:10px;border-left:3px solid var(--accent-line);padding:6px 10px;background:var(--accent-soft);border-radius:0 10px 10px 0}
.kpis{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.kpi{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.kpi b{font-size:18px;color:var(--ink);margin-right:3px;font-variant-numeric:tabular-nums}
@media (min-width:900px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){section.card{animation:none}}
</style>

  document.getElementById("teamChips").innerHTML=(D.main||[]).map(x=>`<span class="chip">${esc(tab(x))} · ${nf(x.field_n)} ${t.shooters}</span>`).join("");
  document.getElementById("evCards").innerHTML=(D.events||[]).map((e,k)=>`<a class="big-card" id="cardEv${k}" href="${esc(e.href)}${q}">
    <span class="ic" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></span>
    <h2>${esc(lang==="es"?e.title_es:e.title_en)}</h2><p>${esc(fmtRange(e.start,e.end))} · ${t.evP}</p>
    <div class="kpis"><span class="kpi"><b>${e.n}</b> ${t.prShooters}</span><span class="kpi"><b>${e.awards}</b> ${t.awards}</span><span class="kpi"><b>${e.medals}</b> ${t.medals}</span></div><span class="go">${t.go}</span></a>`).join("");
  document.getElementById("foot").innerHTML=`${t.src} · ${t.upd}: ${esc((D.generated_at||"").replace("T"," ").replace(/[+-]\d\d:\d\d$/,""))} AST`;
  const lb=document.getElementById("langBtn");lb.textContent=lang==="es"?"English":"Español";
  lb.onclick=()=>{lang=lang==="es"?"en":"es";try{localStorage.setItem("skeet_lang",lang);}catch(e){}history.replaceState(null,"",location.pathname+"?lang="+lang);render();};
  countUp();
}
render();
</script>
</body>
</html>
