<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23e86a1c%22/%3E%3C/svg%3E">
<title>Skeet · NSSA</title>
<style>
:root{
  --bg:#f3f5f8;--card:#ffffff;--card2:#f8fafc;--ink:#0f172a;--muted:#5b6475;--line:#e2e7ee;
  --accent:#0a66c2;--accent-ink:#ffffff;--accent-soft:#e7f0fb;--accent-line:#b9d3f1;
  --hero1:#0a66c2;--hero2:#0b3f7a;--hero-ink:#ffffff;--hero-muted:#d4e4f7;--hero-tile:rgba(255,255,255,.14);
  --gold-bg:#fff2c2;--gold-ink:#6d4c00;--gold-line:#e9c64f;
  --silver-bg:#e6eaf0;--silver-ink:#2f3947;--silver-line:#98a3b3;
  --bronze-bg:#f9e2cf;--bronze-ink:#73390e;--bronze-line:#d9a074;
  --ok-bg:#e3f6ea;--ok-ink:#155c32;--warn-bg:#fff1dc;--warn-ink:#7a4b00;
  --band:#e9eef5;--band-ink:#1f2a3c;--me:#fff8e1;--me-line:#e9c64f;
  --bar:#0a66c2;--bar-bg:#e2e7ee;--shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0f15;--card:#151b23;--card2:#1b222c;--ink:#e6edf3;--muted:#9ba6b4;--line:#2a323d;
  --accent:#5aa9ff;--accent-ink:#06121f;--accent-soft:#16263a;--accent-line:#25476d;
  --hero1:#123a63;--hero2:#0c2340;--hero-ink:#f1f6fc;--hero-muted:#a9c3e0;--hero-tile:rgba(255,255,255,.08);
  --gold-bg:#3b3006;--gold-ink:#ffd968;--gold-line:#8a6d12;
  --silver-bg:#30363f;--silver-ink:#e3e8ef;--silver-line:#7d8794;
  --bronze-bg:#3a2415;--bronze-ink:#f2b488;--bronze-line:#8a5530;
  --ok-bg:#12301f;--ok-ink:#8fe0ad;--warn-bg:#3a2a0c;--warn-ink:#ffcb7a;
  --band:#1e2733;--band-ink:#dbe5f1;--me:#2b2610;--me-line:#8a6d12;
  --bar:#5aa9ff;--bar-bg:#2a323d;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.wrap{max-width:960px;margin:0 auto;padding:12px 12px 40px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header.top h1{font-size:18px;margin:0;flex:1 1 auto;min-width:0}
header.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero .lbl{font-size:12px;color:var(--hero-muted);text-transform:uppercase;letter-spacing:.04em}
.hero .big{font-size:44px;font-weight:800;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;font-weight:600;color:var(--hero-muted)}
.hero .sub{font-size:14px;color:var(--hero-muted)}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.cards{grid-template-columns:1fr 1fr}}@media (min-width:700px){.hero .big{font-size:56px}}
a.big-card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-height:150px;transition:border-color .15s,transform .15s}
a.big-card:hover,a.big-card:focus-visible{border-color:var(--accent);transform:translateY(-1px);outline:none}
a.big-card .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);display:grid;place-items:center;color:var(--accent)}
a.big-card h2{margin:4px 0 0;font-size:20px}
a.big-card p{margin:0;color:var(--muted);font-size:14px}
a.big-card .go{margin-top:auto;font-weight:700;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
footer{font-size:12px;color:var(--muted);margin-top:16px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1 id="title"></h1><button class="btn" id="langBtn" type="button"></button></header>
  <section class="hero" id="hero"></section>
  <div class="cards">
    <a class="big-card" id="cardTeam" href="team/index.html">
      <span class="ic" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2 20c1-3 3.5-5 6-5s5 2 6 5M12 20c1-3 3.5-5 6-5 1.5 0 3 .7 4 2"/></svg></span>
      <h2 id="teamH"></h2><p id="teamP"></p><div class="chips" id="teamChips"></div><span class="go" id="teamGo"></span></a>
    <a class="big-card" id="cardPR" href="pr/index.html">
      <span class="ic" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V4"/><path d="M4 4h13l-2 4 2 4H4"/></svg></span>
      <h2 id="prH"></h2><p id="prP"></p><div class="chips" id="prChips"></div><span class="go" id="prGo"></span></a>
  </div>
  <footer id="foot"></footer>
</div>
<script>
const D={"nssa":"363581","season":"2026","shooter_name":"MICHAEL INFANTE","generated_at":"2026-10-07T09:20-04:00","shoots_count":2,"latest":{"name":"2026 MAIN WORLD CHAMPIONSHIPS","hoa":{"broke":467,"shot":500,"pct":93.4,"cls":"C","awards":["C3","RKRU"]},"haa":{"broke":554,"shot":600,"pct":92.33,"cls":"C","awards":["C2"]}},"team":[{"name":"2026 MAIN WORLD CHAMPIONSHIPS","state":"PR","team":22},{"name":"2026 KOLAR US OPEN","state":"PR","team":33}],"pr_unique":42};
const T={es:{title:"Estadísticas de skeet",latest:"Última tirada", team:"Equipo / Campo",teamP:"Resultados del equipo de Puerto Rico y de todo el campo, por clase y concurrente.",go:"Abrir →",shoots:"tiradas",shooters:"tiradores",
 src:"Fuente: resultados finales de iskeet.org/shoot_reports",upd:"Actualizado",
 pr:"Puerto Rico",prP:"Resumen de todos los tiradores de PR: HOA/HAA más altos, mejores por calibre, medallero, escuadras y clasificaciones.",prU:"tiradores PR distintos"},
 en:{title:"Skeet statistics",latest:"Latest shoot", team:"Team / Field",teamP:"Puerto Rico team and whole-field results, by class and concurrent.",go:"Open →",shoots:"shoots",shooters:"shooters",
 src:"Source: final results from iskeet.org/shoot_reports",upd:"Updated",
 pr:"Puerto Rico",prP:"Summary of every PR shooter: top HOA/HAA, best per gauge, medal table, squads and leaderboards.",prU:"distinct PR shooters"}};
function getLang(){const q=new URLSearchParams(location.search).get("lang");if(q==="es"||q==="en"){try{localStorage.setItem("skeet_lang",q);}catch(e){}return q;}
  try{const l=localStorage.getItem("skeet_lang");if(l==="es"||l==="en")return l;}catch(e){}return "es";}
let lang=getLang();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtp=p=>p==null?"–":(Math.round(p*10)/10).toLocaleString(lang==="es"?"es-PR":"en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
function render(){
  const t=T[lang];document.documentElement.lang=lang;document.title=t.title+" · NSSA "+D.nssa;
  document.getElementById("title").innerHTML=`${t.title}<small>${esc(D.shooter_name||"")} · NSSA ${esc(D.nssa)}</small>`;
  const L=D.latest;
  document.getElementById("hero").innerHTML=L?`<div class="lbl">${t.latest} · ${esc(L.name)}</div>
    <div class="big">${L.hoa?L.hoa.broke:"–"}<small>/${L.hoa?L.hoa.shot:"–"} HOA</small></div>
    <div class="sub">HAA ${L.haa?`<b>${L.haa.broke}</b>/${L.haa.shot} · ${fmtp(L.haa.pct)}`:"–"} · ${D.shoots_count} ${t.shoots} ${esc(D.season)}</div>`:"";
  const q="?lang="+lang;
  document.getElementById("cardTeam").href="team/index.html"+q;document.getElementById("cardPR").href="pr/index.html"+q;
  document.getElementById("prH").textContent=t.pr;document.getElementById("prP").textContent=t.prP;document.getElementById("prGo").textContent=t.go;
  document.getElementById("prChips").innerHTML=`<span class="chip">${D.pr_unique||0} ${t.prU}</span><span class="chip">${(D.team||[]).length} ${t.shoots}</span>`;
  document.getElementById("teamH").textContent=t.team;document.getElementById("teamP").textContent=t.teamP;
  document.getElementById("teamGo").textContent=t.go;
  document.getElementById("teamChips").innerHTML=(D.team||[]).map(x=>`<span class="chip">${esc(x.name)} · ${x.team} ${t.shooters} ${esc(x.state)}</span>`).join("");
  document.getElementById("foot").innerHTML=`${t.src} · ${t.upd}: ${esc((D.generated_at||"").replace("T"," ").replace(/[+-]\d\d:\d\d$/,""))} AST`;
  const lb=document.getElementById("langBtn");lb.textContent=lang==="es"?"English":"Español";
  lb.onclick=()=>{lang=lang==="es"?"en":"es";try{localStorage.setItem("skeet_lang",lang);}catch(e){}history.replaceState(null,"",location.pathname+"?lang="+lang);render();};
}
render();
</script>
</body>
</html>
